[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mcp-route-reliability"
version = "0.1.0"
description = "Router-agnostic reliability evaluation for MCP tool routing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "MCP Route Reliability Lab contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<24",
  "pydantic>=2.6,<3",
  "rank-bm25>=0.2.2,<0.3",
  "scikit-learn>=1.4,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3,<6"]
report = ["matplotlib>=3.8,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
mrrl = "mcp_route_reliability.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_route_reliability"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_route_reliability"]
mypy_path = "src"
